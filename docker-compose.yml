services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trishield
      POSTGRES_USER: trishield
      POSTGRES_PASSWORD: trishield
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trishield"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://trishield:trishield@postgres:5432/trishield
      JWT_SECRET_KEY: change-me-in-production
      CORS_ALLOW_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
